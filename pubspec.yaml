flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  android: true
  ios: true
  color: "#15151E"
  image: assets/splash_logo.png
  android_12:
    color: "#15151E"
    image: assets/splash_logo.png    
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/svg/
    - assets/
    - assets/languages/
    - assets/svg/bottomnav/
